[package]
name = "nsh-gpui-agent-windows"
description = "Strict GPUI-agent actions for Windows development surfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-windows-host"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
nsh-agent-actions.workspace = true
nsh-gpui-agent = { path = "../nsh-gpui-agent", features = ["dev-agent"] }
nsh-core.workspace = true
nsh-testing = { workspace = true, features = ["agent"] }
nsh-platform-windows.workspace = true
nsh-windows-host.workspace = true
nsh-base.workspace = true
log.workspace = true
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
