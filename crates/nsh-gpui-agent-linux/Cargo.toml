[package]
name = "nsh-gpui-agent-linux"
description = "Linux development host integration for NSH's strict agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-linux-host"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-agent-actions.workspace = true
nsh-gpui-agent = { path = "../nsh-gpui-agent", features = ["dev-agent"] }
nsh-core.workspace = true
nsh-testing = { workspace = true, features = ["agent"] }
nsh-platform-linux.workspace = true
nsh-linux-host.workspace = true
nsh-base.workspace = true
log.workspace = true
