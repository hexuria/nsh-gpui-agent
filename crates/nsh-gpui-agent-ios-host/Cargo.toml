[package]
name = "nsh-gpui-agent-ios-host"
description = "Native Shell iOS development host with the optional tool attachment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-ios-host"
path = "src/main.rs"

[target.'cfg(target_os = "ios")'.dependencies]
nsh-gpui-agent = { path = "../nsh-gpui-agent", features = ["ios"] }
nsh-ios-host.workspace = true
nsh-platform-ios.workspace = true
nsh-base.workspace = true
