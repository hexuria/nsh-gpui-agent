[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/hexuria/nsh-gpui-agent"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
nsh-agent-actions = { path = "crates/nsh-agent-actions" }
gpui-agent = "=0.3.0"
# One NSH per build: every nsh-* crate comes from branch `gpui-agent` of the
# fork, pinned to the tested commit (see README.md, "Which NSH to use"). An app that builds NSH from its
# own checkout redirects these with `[patch."https://github.com/hexuria/nsh"]`.
nsh-core = { git = "https://github.com/hexuria/nsh", rev = "542291b7a3870824432dd56d60db28c2709825d7" }
nsh-dev = { git = "https://github.com/hexuria/nsh", rev = "542291b7a3870824432dd56d60db28c2709825d7" }
nsh-testing = { git = "https://github.com/hexuria/nsh", rev = "542291b7a3870824432dd56d60db28c2709825d7", default-features = false }
nsh-platform-macos = { git = "https://github.com/hexuria/nsh", rev = "542291b7a3870824432dd56d60db28c2709825d7", features = ["dev"] }
nsh-macos-host = { git = "https://github.com/hexuria/nsh", rev = "542291b7a3870824432dd56d60db28c2709825d7" }
nsh-base = { git = "https://github.com/hexuria/nsh", rev = "542291b7a3870824432dd56d60db28c2709825d7" }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSAccessibility",
  "NSAccessibilityConstants",
  "NSAccessibilityCustomAction",
  "NSAccessibilityElement",
  "NSAccessibilityProtocols",
  "NSAlert",
  "NSAnimationContext",
  "NSAppearance",
  "NSApplication",
  "NSAttributedString",
  "NSBezierPath",
  "NSBitmapImageRep",
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSColor",
  "NSColorSpace",
  "NSControl",
  "NSCursor",
  "NSDragging",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSLayoutConstraint",
  "NSMenu",
  "NSMenuItem",
  "NSParagraphStyle",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSProgressIndicator",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSScrollView",
  "NSSecureTextField",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSText",
  "NSLayoutManager",
  "NSTextContainer",
  "NSTextField",
  "NSActionCell",
  "NSUserInterfaceValidation",
  "NSTextFieldCell",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSTextStorage",
  "NSTextView",
  "NSToolbar",
  "NSTrackingArea",
  "NSUserInterfaceItemIdentification",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFAttributedString",
  "CFCGTypes",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGBitmapContext",
  "CGColor",
  "CGColorSpace",
  "CGContext",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGEvent",
  "CGEventTypes",
  "CGGradient",
