[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/hexuria/nsh-gpui-agent"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
nsh-agent-actions = { path = "crates/nsh-agent-actions" }
nsh-gpui-agent = { path = "crates/nsh-gpui-agent" }
gpui-agent = "=0.3.0"
# One NSH per build: every nsh-* crate comes from branch `gpui-agent` of the
# fork, pinned to the tested commit (see README.md, "Which NSH to use"). An app that builds NSH from its
# own checkout redirects these with `[patch."https://github.com/hexuria/nsh"]`.
nsh-core = { git = "https://github.com/hexuria/nsh", rev = "2cce2a8d030495e4b20346a58afe23349f6cd6bf" }
nsh-dev = { git = "https://github.com/hexuria/nsh", rev = "2cce2a8d030495e4b20346a58afe23349f6cd6bf" }
nsh-testing = { git = "https://github.com/hexuria/nsh", rev = "2cce2a8d030495e4b20346a58afe23349f6cd6bf", default-features = false }
log = "0.4"
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
nsh-cli = { git = "https://github.com/hexuria/nsh", rev = "2cce2a8d030495e4b20346a58afe23349f6cd6bf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
