  "CGPath",
  "CGWindowLevel",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSArray",
  "NSAttributedString",
  "NSBundle",
  "NSCache",
  "NSCalendar",
  "NSData",
  "NSDictionary",
  "NSDate",
  "NSDateFormatter",
  "NSDistributedNotificationCenter",
  "NSEnumerator",
  "NSError",
  "NSFormatter",
