objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CADisplayLink",
  "CAFrameRateRange",
  "CALayer",
  "CATransform3D",
  "CAAnimation",
  "CAMediaTiming",
  "CAShapeLayer",
  "CATransaction",
  "CAGradientLayer",
  "CAMediaTimingFunction",
  "CABase",
] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2"
getrandom = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
