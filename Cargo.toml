[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/hexuria/nsh-gpui-agent"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
nsh-agent-actions = { path = "crates/nsh-agent-actions" }
gpui-agent = "=0.3.0"
# One NSH per build: every nsh-* crate comes from branch `gpui-agent` of the
# fork, pinned to the tested commit (see README.md, "Which NSH to use"). An app that builds NSH from its
# own checkout redirects these with `[patch."https://github.com/hexuria/nsh"]`.
nsh-core = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa" }
nsh-dev = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa" }
nsh-testing = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa", default-features = false }
nsh-platform-ios = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa", features = ["dev"] }
nsh-ios-host = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa" }
nsh-base = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa" }
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
nsh-cli = { git = "https://github.com/hexuria/nsh", rev = "ca714e1fbfdda1ebd0cbd8b0fe3c04f1d307b6aa" }
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIApplication", "UIResponder", "UIView", "UIWindow"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
