[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/hexuria/nsh-gpui-agent"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
nsh-agent-actions = { path = "crates/nsh-agent-actions" }
gpui-agent = "=0.3.0"
# One NSH per build: every nsh-* crate comes from branch `gpui-agent` of the
# fork, pinned to the tested commit (see README.md, "Which NSH to use"). An app that builds NSH from its
# own checkout redirects these with `[patch."https://github.com/hexuria/nsh"]`.
nsh-core = { git = "https://github.com/hexuria/nsh", rev = "b609258a57ff1e8eefae34a7733f69bfca5fda0c" }
nsh-dev = { git = "https://github.com/hexuria/nsh", rev = "b609258a57ff1e8eefae34a7733f69bfca5fda0c" }
nsh-testing = { git = "https://github.com/hexuria/nsh", rev = "b609258a57ff1e8eefae34a7733f69bfca5fda0c", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
